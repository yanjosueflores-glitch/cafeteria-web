<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Comentarios</title>

<link rel="stylesheet"
href="css/estilos.css">

</head>

<body>

<header>

<h1>Cafetería Mis Cielos</h1>

<nav>

<ul class="menu">

<li><a href="index.html">Inicio</a></li>

<li><a href="menu.html">Menú</a></li>

<li><a href="reservas.html">Reservas</a></li>

<li><a href="promociones.html">Promociones</a></li>

<li><a href="comentarios.html">Comentarios</a></li>

</ul>

</nav>

</header>

<section class="formulario">

<h2>Déjanos tu Opinión</h2>

<form id="formComentario">

<label>Nombre</label>

<input
type="text"
id="nombreComentario"
required>

<label>Calificación</label>

<select id="calificacion">

<option>⭐</option>
<option>⭐⭐</option>
<option>⭐⭐⭐</option>
<option>⭐⭐⭐⭐</option>
<option selected>⭐⭐⭐⭐⭐</option>

</select>

<label>Comentario</label>

<textarea
id="textoComentario"
rows="5"
required>
</textarea>

<button type="submit">

Publicar Comentario

</button>

</form>

</section>

<section class="comentarios">

<h2>Opiniones de Clientes</h2>

<div id="listaComentarios">

</div>

</section>

<script>

let comentarios = JSON.parse(localStorage.getItem("comentarios")) || [];

function mostrarComentarios() {
  let lista = document.getElementById("listaComentarios");
  lista.innerHTML = "";

  comentarios.forEach(function(c) {
    let bloque = `
      <div class="comentario">
        <h3>${c.nombre}</h3>
        <p>${c.estrellas}</p>
        <p>${c.comentario}</p>
        <small>${c.fecha}</small>
      </div>
    `;
    lista.innerHTML += bloque;
  });
}

document
  .getElementById("formComentario")
  .addEventListener("submit", function(e) {

    e.preventDefault();

    let nombre = document.getElementById("nombreComentario").value;
    let estrellas = document.getElementById("calificacion").value;
    let comentario = document.getElementById("textoComentario").value;
    let fecha = new Date().toLocaleDateString();

    let nuevoComentario = {
      nombre: nombre,
      estrellas: estrellas,
      comentario: comentario,
      fecha: fecha
    };

    comentarios.push(nuevoComentario);

    localStorage.setItem("comentarios", JSON.stringify(comentarios));

    mostrarComentarios();

    this.reset();
  });

mostrarComentarios();

</script>

</body>

</html>
